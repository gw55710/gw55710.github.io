<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Krzysztof Śledź (55763) i Wojciech Grzymała (55710) - IS LAB B</title>

    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <main>
        <h1>Lista zadań</h1>

        <section aria-labelledby="search-heading">
            <h2 id="search-heading">Wyszukaj zadanie</h2>
            <label for="task-search">Szukaj na liście</label>
            <input id="task-search" type="search" placeholder="Wpisz nazwę zadania">
        </section>

        <section aria-labelledby="tasks-heading">
            <h2 id="tasks-heading">Twoje zadania</h2>
            <div id="task-list"></div>
            <p id="empty-message" hidden>Brak zadań do wyświetlenia.</p>
        </section>

        <section aria-labelledby="add-heading">
            <h2 id="add-heading">Dodaj zadanie</h2>
            <form id="add-task-form">
                <label for="new-task">Nazwa zadania</label>
                <input id="new-task" name="task" type="text" placeholder="Np. Zadzwonić do..." required>
                <button type="submit">Dodaj</button>
            </form>
        </section>
    </main>
</body>
</html>
